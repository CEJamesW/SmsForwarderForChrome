<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>SmsForwarder content script smoke test</title>
  <style>
    body { font: 16px sans-serif; padding: 24px; }
    label, fieldset { display: block; margin: 12px 0; }
    input, select { padding: 8px; }
    #segmented { display: flex; gap: 6px; }
    #segmented input { width: 24px; }
  </style>
  <script>
    window.autofillMessageListener = null;
    window.chrome = {
      runtime: {
        onMessage: { addListener: function(listener) { window.autofillMessageListener = listener; } },
        sendMessage: function() {
          return Promise.resolve({
            autoFillCode: true
          });
        }
      }
    };
  </script>
</head>
<body>
  <label>国家区号
    <select id="country" aria-label="国家区号">
      <option value="+1">United States (+1)</option>
      <option value="+44">United Kingdom (+44)</option>
      <option value="+86">中国 (+86)</option>
    </select>
  </label>
  <label>手机号
    <input id="phone" type="tel" autocomplete="tel-national">
  </label>
  <label>验证码
    <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
  </label>
  <div id="dynamic"></div>
  <script src="../shared/phoneutil.js"></script>
  <script src="../content/autofill.js"></script>
  <script>
    window.sendAutofill = function(code) {
      window.autofillMessageListener({
        type: 'SMS_AUTOFILL',
        code: code,
        autoFillCode: true
      });
    };
    window.fillPhoneFromContextMenu = function() {
      document.getElementById('phone').dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, composed: true }));
      window.autofillMessageListener({
        type: 'SMS_FILL_PHONE_FROM_CONTEXT_MENU',
        profile: {
          countryCode: '+86',
          nationalNumber: '13812345678',
          e164: '+8613812345678',
          countryIso: 'cn'
        }
      });
    };
    window.createSegmentedInputs = function() {
      document.getElementById('otp').closest('label').remove();
      var holder = document.getElementById('dynamic');
      holder.innerHTML = '<fieldset><legend>OTP 验证码</legend><div id="segmented">' +
        Array.from({ length: 6 }, function(_, i) {
          return '<input maxlength="1" inputmode="numeric" aria-label="OTP digit ' + (i + 1) + '">';
        }).join('') + '</div></fieldset>';
    };
  </script>
</body>
</html>
